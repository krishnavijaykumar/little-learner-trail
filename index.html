<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Little Learner Trail: a level-based phonics, spelling, sentence and number game for kids aged 4 to 7.">
<meta name="theme-color" content="#DDF1EC">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Little Learner Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen app; chunky sticker-paper cards on a monsoon-mint sky, marigold for reward, ink outlines everywhere */
:root{
  --sky:#DDF1EC; --sky-deep:#BFE4DB; --hill:#A8D8C6; --hill-deep:#86C3AE;
  --paper:#FFFDF7; --ink:#1D2747; --ink-soft:#4A5577; --mute:#C9D1DE;
  --marigold:#F5A623; --marigold-soft:#FFE6AE;
  --peacock:#0C8A8E; --peacock-soft:#CBEDEB;
  --lotus:#E0517A; --lotus-soft:#FCD6E1;
  --leaf:#4C9A3B; --leaf-soft:#D8F0CD;
  --elephant:#A9BCD9; --elephant-in:#F5B8C8; --mouth:#8E2F45;
  --display:'Baloo 2', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --learn:'Andika', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
.intro,.gate,.sleepy,.wcard,.wcard input,.ghint,.card{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--display);-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body::after{content:"";position:fixed;inset:auto 0 0 0;height:22vh;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 15% 100%,var(--hill-deep) 0 45%,transparent 46%),radial-gradient(110% 80% at 85% 100%,var(--hill) 0 50%,transparent 51%)}
#app{position:relative;z-index:1;height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--peacock);outline-offset:3px}
.screen{height:100%;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:16px}
.wrap{width:100%;max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}

/* chunky sticker surfaces */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink)}
.press{transition:transform .08s, box-shadow .08s}
.press:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.topbar h1{min-width:0;font-size:clamp(20px,5vw,32px);font-weight:800;margin:0;text-wrap:balance;text-align:center;flex:1;line-height:1.1}
.iconbtn{width:60px;height:60px;flex:none;border-radius:20px;display:grid;place-items:center;font-size:28px;font-weight:800;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--marigold-soft);border:3px solid var(--ink);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Gajju */
.gajju{display:block;overflow:visible}
.gajju .g-ear{fill:var(--elephant);stroke:var(--ink);stroke-width:2.5}
.gajju .g-ear-in{fill:var(--elephant-in)}
.gajju .g-head{fill:var(--elephant);stroke:var(--ink);stroke-width:2.5}
.gajju .g-trunk{fill:none;stroke:var(--elephant);stroke-width:13;stroke-linecap:round}
.gajju .g-trunk-o{fill:none;stroke:var(--ink);stroke-width:18;stroke-linecap:round}
.gajju .g-eye{fill:var(--ink)} .gajju .g-shine{fill:var(--paper)}
.gajju .g-cheek{fill:var(--elephant-in)}
.gajju .g-lid{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.gajju .g-scarf{fill:var(--lotus);stroke:var(--ink);stroke-width:2.5}
.gajju .g-cap{fill:var(--peacock);stroke:var(--ink);stroke-width:2.5}
.gajju .g-gold{fill:var(--marigold);stroke:var(--ink);stroke-width:2.5}
.gajju .g-petal{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.gajju .g-mouth{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.gajju .g-mouth-open{fill:var(--mouth);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;display:none;transform-box:view-box;transform-origin:60px 74px}
.gajju .g-tongue{fill:var(--lotus)}
.gajju .g-mouth-o{fill:var(--mouth);stroke:var(--ink);stroke-width:2.5;display:none}
.gajju .g-eyes-happy{display:none} .gajju .g-eyes-happy path{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.gajju .g-eyes-open{transform-box:view-box;transform-origin:60px 52px;animation:blink 4.8s infinite}
.gajju .g-earL{transform-box:view-box;transform-origin:42px 56px} .gajju .g-earR{transform-box:view-box;transform-origin:78px 56px}
.gajju.talking .g-mouth{display:none}
.gajju.talking .g-mouth-open{display:inline;animation:talk .2s ease-in-out infinite alternate}
.gajju.mood-cheer .g-mouth{display:none} .gajju.mood-cheer .g-mouth-open{display:inline}
.gajju.mood-cheer .g-eyes-open{display:none} .gajju.mood-cheer .g-eyes-happy{display:inline}
.gajju.mood-cheer .g-earL{animation:flapL .22s ease-in-out 6 alternate} .gajju.mood-cheer .g-earR{animation:flapR .22s ease-in-out 6 alternate}
.gajju.mood-cheer .g-cheek{fill:var(--lotus);opacity:.7}
.gajju.mood-oops .g-mouth{display:none} .gajju.mood-oops .g-mouth-o{display:inline}
.gajju.mood-oops.talking .g-mouth-open{display:none}
.mood-happy{animation:bob 2.6s ease-in-out infinite}
.mood-cheer{animation:hop .5s ease-out 2}
.mood-think,.mood-oops{animation:tilt 1s ease-in-out}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.05)}}
@keyframes flapL{to{transform:rotate(-14deg)}} @keyframes flapR{to{transform:rotate(14deg)}}
.gbar{grid-area:g;display:flex;align-items:center;gap:12px}
.gajju-btn{flex:none;width:88px;height:88px;padding:0;border-radius:50%}
.gajju-btn .gajju{width:100%;height:100%}
.say{position:relative;flex:1;min-width:0;min-height:60px;display:flex;align-items:center;padding:10px 16px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);font-family:var(--learn);font-weight:700;font-size:clamp(17px,4.4vw,22px);line-height:1.3;overflow-wrap:anywhere}
.say::before{content:"";position:absolute;left:-13px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:13px solid var(--ink);border-left:0}
.say::after{content:"";position:absolute;left:-8px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:9px solid var(--paper);border-left:0}
.say.pop{animation:bpop .3s}
@keyframes bpop{50%{transform:scale(1.03)}}
.intro{margin:auto;width:min(460px,100%);padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:ipop .45s}
@keyframes ipop{from{transform:scale(.85);opacity:0}}
.intro .gajju{width:150px;height:150px}
.intro .eyebrow{font-weight:800;font-size:18px;color:var(--ink-soft);letter-spacing:.02em}
.intro h2{margin:0;font-size:clamp(40px,11vw,56px);line-height:1}
.intro .ititle{margin:0 0 6px;font-family:var(--learn);font-weight:700;font-size:clamp(22px,6vw,28px)}
.confetti{position:fixed;top:-24px;width:10px;height:16px;z-index:65;pointer-events:none;border:1.5px solid var(--ink);animation:fall var(--d) cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(var(--r))}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{40%{transform:translateY(-16px) scale(1.05)}}
@keyframes tilt{30%{transform:rotate(-10deg)}70%{transform:rotate(6deg)}}

/* home */
.hero{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.hero .gajju{width:clamp(130px,30vw,190px);height:auto}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 18px;font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.15;max-width:280px;box-shadow:0 4px 0 var(--ink)}
.tracks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.trackcard{min-width:0}
@media (max-width:360px){.tbr{gap:8px}.musbtn{width:52px;height:52px}.grown{padding:0 12px;font-size:14px;height:52px}.tracks{gap:10px}.trackcard .chip{font-size:15px;padding:4px 8px}.pillbtn{font-size:18px;padding:10px 16px}}
.trackcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px 16px;text-align:center}
.trackcard .big{font-family:var(--learn);font-weight:700;font-size:clamp(40px,11vw,64px);line-height:1;letter-spacing:.02em}
.trackcard .name{font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1}
.trackcard.words{background:var(--lotus-soft)} .trackcard.words .big{color:var(--lotus)}
.trackcard.numbers{background:var(--leaf-soft)} .trackcard.numbers .big{color:var(--leaf)}
.homerow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pillbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:var(--marigold-soft);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:22px}
.tbr{display:flex;align-items:center;gap:14px}
.musbtn{font-size:26px}
.gbtn{padding:0;border-radius:50%;display:block}
.gbtn .gajju{width:clamp(130px,30vw,190px);height:auto}
.grown{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;gap:6px;height:56px;padding:0 16px;border-radius:999px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;font-weight:700;white-space:nowrap}
.grown .gfill{position:absolute;inset:0;background:var(--peacock-soft);transform:scaleX(0);transform-origin:left;pointer-events:none}
.grown.holding .gfill{transition:transform 3s linear;transform:scaleX(1)}
.grown .gl{position:relative;display:inline-flex;align-items:center;gap:6px}
.grown.big{height:72px;padding:0 26px;font-size:20px}
.ghint{position:fixed;z-index:70;max-width:min(280px,calc(100vw - 32px));padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--paper);font:600 15px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif;box-shadow:0 6px 18px rgba(29,39,71,.3);pointer-events:none;animation:pop .3s}
.welcome{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;align-items:center}
.welcome .wrap{max-width:560px}
.wcard{padding:22px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.wcard .gajju{width:110px;height:110px}
.wcard h1{margin:0;font-family:var(--display);font-size:clamp(26px,6vw,34px);line-height:1.1;text-wrap:balance}
.wcard p{margin:0;font-size:16px;line-height:1.5;color:var(--ink-soft);max-width:44ch}
.wsteps{display:flex;gap:8px;justify-content:center}
.wsteps i{width:34px;height:8px;border-radius:4px;background:var(--mute)}
.wsteps i.on{background:var(--peacock)}
.wok{font-weight:700;color:var(--leaf);font-size:17px}
.wcard input{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);width:100%;max-width:320px}
.wbtn{min-height:56px;padding:0 26px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:var(--marigold);font:800 20px var(--display)}
.ptip{font-size:14px;padding:10px 14px;border-radius:12px;background:var(--peacock-soft);border:2px solid var(--ink);line-height:1.45}

/* worlds */
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.worldcard{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;padding:16px;text-align:left;background:var(--paper)}
.worldcard .emo{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:48px;background:var(--wc-soft);border:3px solid var(--ink)}
.worldcard h2{margin:0;font-size:26px;line-height:1.05;font-weight:800}
.worldcard p{margin:4px 0 8px;font-family:var(--learn);font-size:16px;color:var(--ink-soft);line-height:1.3}
.bar{height:14px;border-radius:999px;background:var(--mute);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--marigold)}
.worldcard.locked{background:#EEF1F5;box-shadow:0 5px 0 var(--ink-soft);border-color:var(--ink-soft)}
.worldcard.locked .emo{filter:grayscale(1);opacity:.55}
.lockline{font-family:var(--learn);font-size:15px;color:var(--ink-soft)}

/* map */
.map{position:relative;width:100%;max-width:560px;margin-inline:auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map svg.path path{fill:none;stroke:var(--paper);stroke-width:14;stroke-linecap:round;vector-effect:non-scaling-stroke}
.map svg.path path.dash{stroke:var(--ink);stroke-width:3;stroke-dasharray:2 12;vector-effect:non-scaling-stroke}
.stone{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.stone .disc{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-family:var(--learn);font-weight:700;font-size:32px;background:var(--wc-soft);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.stone .disc.sm{font-size:19px}
.stone.boss .disc{width:92px;height:92px;font-size:38px;background:var(--marigold-soft)}
.stone.locked .disc{background:#E4E8EF;color:var(--ink-soft);border-color:var(--ink-soft);box-shadow:0 5px 0 var(--ink-soft);font-size:26px}
.stone.current .disc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.stone .lt{font-family:var(--learn);font-size:14px;font-weight:700;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:1px 8px;max-width:150px;text-align:center;line-height:1.2}
.stars3{display:flex;gap:2px;font-size:18px;line-height:1}
.stars3 .off{filter:grayscale(1);opacity:.3}
.mapg{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);pointer-events:none}

/* play */
.play{gap:12px}
.playbar{display:flex;align-items:center;gap:12px;width:100%;max-width:1040px;margin-inline:auto}
.stone .stars3{margin-top:6px}
.dots{flex:1;min-width:0;display:flex;gap:clamp(2px,1vw,6px);justify-content:center;flex-wrap:nowrap}
.dots i{flex:none;width:clamp(10px,3vw,16px);height:clamp(10px,3vw,16px);border-radius:50%;border:2.5px solid var(--ink);background:var(--paper)}
.dots i.done{background:var(--leaf)} .dots i.now{background:var(--marigold);transform:scale(1.2)}
.replay{background:var(--marigold-soft)}
.stage{display:grid;gap:16px;grid-template-columns:1fr;grid-template-areas:"g" "p" "a";align-content:start;width:100%;max-width:1040px;margin-inline:auto}
.prompt{grid-area:p}.answers{grid-area:a}
@media (min-width:860px) and (orientation:landscape){.stage{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-areas:"g a" "p a";align-items:start}}
.prompt{position:relative;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:180px;justify-content:center}
.v-emoji{font-size:clamp(72px,18vw,110px);line-height:1.05}
.bigspeak{width:96px;height:96px;border-radius:50%;font-size:46px;background:var(--marigold-soft);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.v-text{font-family:var(--learn);font-weight:700;font-size:clamp(30px,8vw,48px);text-align:center;line-height:1.2;text-wrap:balance;letter-spacing:.02em}
.v-small{font-family:var(--learn);font-size:clamp(17px,4.4vw,22px);text-align:center;color:var(--ink-soft);line-height:1.4;max-width:34ch}
.v-word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-family:var(--learn);font-weight:700}
.v-word .lt{min-width:64px;height:84px;padding:0 10px;border-radius:16px;font-size:58px;background:var(--peacock-soft);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);line-height:1}
.v-word .seg{font-size:58px;line-height:84px}
.qblank{display:inline-block;min-width:1.3em;padding:0 .12em;border-bottom:5px solid var(--marigold);color:var(--marigold);text-align:center;line-height:1.1}
.qblank.filled{color:var(--leaf);border-color:var(--leaf);animation:pop .4s}
@keyframes pop{50%{transform:scale(1.25)}}
.v-groups{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.v-op{font-family:var(--learn);font-weight:700;font-size:44px}
.grp{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:220px;font-size:34px;line-height:1.1}
.grp.big{font-size:56px} .grp.small{font-size:22px}
.v-count,.v-cross{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;max-width:420px}
.cnt{position:relative;aspect-ratio:1;max-width:100%;border-radius:16px;background:var(--paper);border:2.5px dashed var(--ink-soft);font-size:clamp(30px,8vw,42px);display:grid;place-items:center}
.cnt.on{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft)}
.cnt b{position:absolute;top:-8px;right:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--leaf);color:var(--paper);font-size:16px;display:none;place-items:center;border:2px solid var(--ink);font-family:var(--learn)}
.cnt.on b{display:grid}
.cnt.gone{opacity:.35;background:var(--lotus-soft)}
.cnt.gone::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:5px;border-radius:3px;background:var(--lotus);transform:rotate(-35deg)}
.frame{display:grid;grid-template-columns:repeat(5,1fr);border:3px solid var(--ink);border-radius:10px;overflow:hidden;width:min(320px,100%)}
.frame span{aspect-ratio:1;border:1.5px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.frame span.f::after{content:"";width:62%;height:62%;border-radius:50%;background:var(--lotus);border:2px solid var(--ink)}
.strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.strip span{min-width:66px;height:72px;padding:0 8px;border-radius:14px;display:grid;place-items:center;font-family:var(--learn);font-weight:700;font-size:38px;background:var(--peacock-soft);border:3px solid var(--ink)}
.strip span.qblank{background:var(--marigold-soft);border-bottom-width:3px;color:var(--ink)}
.strip span.qblank.filled{background:var(--leaf-soft)}
.tens{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.tens .ten{display:grid;grid-template-rows:repeat(10,13px);gap:2px;padding:3px;border:2.5px solid var(--ink);border-radius:8px;background:var(--marigold-soft)}
.tens .ten i,.tens .one{width:20px;height:13px;border-radius:3px;background:var(--marigold);border:1.5px solid var(--ink)}
.tens .ones{display:grid;grid-template-columns:repeat(2,20px);gap:4px}
.tens .one{height:20px;border-radius:50%;background:var(--peacock)}

.answers{display:flex;flex-direction:column;gap:14px}
.opts{display:grid;gap:14px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.optwrap{position:relative;display:flex;min-width:0}
.opt{flex:1;min-width:0;min-height:110px;padding:10px;border-radius:24px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;transition:transform .08s,box-shadow .08s,opacity .3s}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt .lab{font-family:var(--learn);font-weight:700;font-size:clamp(44px,12vw,64px);line-height:1;overflow-wrap:anywhere}
.opt.k-emoji .lab{font-size:clamp(52px,14vw,76px)}

function makeQuestion(world,li,r,ctx){
  var L=world.levels[li],q=null;
  var gens=world.levels.filter(function(x,i){return !x.boss&&i<li;});
  for(var t=0;t<30;t++){
    var g=L.gen;
    if(L.boss)g=pick(r,gens).gen;
    else if(li>=2&&r()<0.15)g=pick(r,gens).gen;
    q=g(r,ctx.k||3);
    if(q.key!==ctx.last&&(!ctx.used[q.key]||t>=15))break;
  }
  ctx.used[q.key]=1;ctx.last=q.key;return q;
}
function validateQ(q){
  if(q.mode==='mcq'){
    if(!q.options||q.options.length<2)return 'too few options';
    if(!(q.answer>=0&&q.answer<q.options.length))return 'bad answer index';
    var sig=q.options.map(function(o){return o.kind+':'+o.label+':'+(o.group?o.group.emo+o.group.n+o.group.big:'');});
    for(var i=0;i<sig.length;i++)if(sig.indexOf(sig[i])!==i)return 'duplicate option '+sig[i];
    for(var j=0;j<q.options.length;j++){var o=q.options[j];if(o.kind==='num'&&(o.v<0||!Number.isInteger(o.v)))return 'bad number '+o.v;}
  }else{
    var pool=q.pool.slice();for(var x=0;x<q.target.length;x++){var at=pool.indexOf(q.target[x]);if(at<0)return 'pool missing '+q.target[x];pool.splice(at,1);}
  }
  if(!q.say||!q.key)return 'missing say/key';
  return '';
}

function calcStars(total,firstTry){if(!total)return 1;var r=firstTry/total;return r>=0.8?3:r>=0.5?2:1;}

  return {best:Math.max(prev.best||0,res.stars),attempts:(prev.attempts||0)+1,last:now,ft:(prev.ft||0)+res.firstTry,q:(prev.q||0)+res.total};}
function trackWorlds(track){return WORLDS.filter(function(w){return w.track===track;});}
function worldOpen(w,prog,unlockAll){
  if(unlockAll)return true;var tw=trackWorlds(w.track),i=tw.indexOf(w);if(i<=0)return true;
  var prev=tw[i-1],boss=prev.levels[prev.levels.length-1];return ((prog[boss.id]||{}).best||0)>=2;}
function levelOpen(w,li,prog,unlockAll){

/* ---------- pin hashing (tamper deterrence, not security) ---------- */
function cyrb53(s,seed){seed=seed||0;var a=0xdeadbeef^seed,b=0x41c6ce57^seed;
  for(var i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  return (4294967296*(2097151&b)+(a>>>0)).toString(16);}
function hashPin(pin,salt){var h=String(pin)+'|'+salt;for(var i=0;i<1000;i++)h=cyrb53(h+salt);return h;}

function cheerList(base){

  var words={3:'Superstar!',2:'Great job!',1:'You did it!'},t1=450+stars*420+150;

var gate=null;
function openGate(mode,onok){
  var m=mode||(S.pin?'enter':'challenge');
  gate={mode:m,buf:'',first:'',busy:false,view:'pad',a:6+Math.floor(Math.random()*4),b:6+Math.floor(Math.random()*4),onok:onok||function(){go('parent');}};drawGate();
}
function closeGate(){gate=null;var o=document.getElementById('gateov');if(o)o.remove();}
function drawGate(msg){
  var o=document.getElementById('gateov');if(!o){o=document.createElement('div');o.id='gateov';o.className='overlay';document.body.appendChild(o);}
  if(gate.view!=='pad')return;
  var NW=['zero','one','two','three','four','five','six','seven','eight','nine'];
  var titles={challenge:'Grown-ups first',create1:'Create a grown-up PIN',create2:'Type the PIN again',enter:'Grown-ups only'};
  var sub={challenge:'Before setting a PIN, type the answer to: '+NW[gate.a]+' times '+NW[gate.b]+'.',create1:'Pick 4 numbers. You will need them to open settings.',create2:'Just to be sure.',enter:'Enter your 4-number PIN.'};
  var len=gate.mode==='challenge'?2:4;
  var lockLeft=S.pin&&S.pin.lockUntil>Date.now()?Math.ceil((S.pin.lockUntil-Date.now())/1000):0;
  var dots='';for(var i=0;i<len;i++)dots+='<i class="'+(i<gate.buf.length?'on':'')+'"></i>';
  var keys=[1,2,3,4,5,6,7,8,9].map(function(k){return '<button data-act="pin" data-k="'+k+'">'+k+'</button>';}).join('')+
    '<button class="ghost" data-act="gateCancel">Cancel</button><button data-act="pin" data-k="0">0</button><button class="ghost" data-act="pinDel" aria-label="Delete">⌫</button>';
  o.innerHTML='<div class="card gate" role="dialog" aria-modal="true" aria-label="'+titles[gate.mode]+'"><h2>'+titles[gate.mode]+'</h2><p>'+(lockLeft&&gate.mode==='enter'?'Too many tries. Wait '+lockLeft+' seconds.':esc(msg?msg+(gate.mode==='challenge'?' '+sub.challenge:''):sub[gate.mode]))+'</p>'+
    '<div class="pindots" id="pindots">'+dots+'</div><div class="keypad">'+keys+'</div>'+
    (gate.mode==='enter'&&!sleepyOn?'<button class="linkbtn" data-act="forgot">Forgot PIN?</button>':'')+'</div>';
  if(lockLeft)setTimeout(function(){if(gate)drawGate();},1000);
}
function pinKey(k){
  if(!gate||gate.busy||gate.view!=='pad')return;if(S.pin&&S.pin.lockUntil>Date.now()&&gate.mode==='enter')return;
  var len=gate.mode==='challenge'?2:4;
  if(gate.buf.length<len)gate.buf+=k;sfx('key');drawGate();
  if(gate.buf.length<len)return;
  var b=gate.buf;gate.busy=true;
  setTimeout(function(){
    if(!gate)return;gate.busy=false;
    if(gate.mode==='challenge'){gate.buf='';if(+b===gate.a*gate.b){gate.mode='create1';drawGate();}else{gate.a=6+Math.floor(Math.random()*4);gate.b=6+Math.floor(Math.random()*4);drawGate('Not quite. Try this one.');}}
    else if(gate.mode==='create1'){gate.first=b;gate.buf='';gate.mode='create2';drawGate();}
    else if(gate.mode==='create2'){
      if(b===gate.first){var salt=Math.random().toString(36).slice(2,10);S.pin={salt:salt,hash:C.hashPin(b,salt),fails:0,lockUntil:0};save();var f=gate.onok;closeGate();f();}
      else{gate.mode='create1';gate.buf='';gate.first='';drawGate('Those did not match. Start again.');}
    }else{
      if(C.hashPin(b,S.pin.salt)===S.pin.hash){S.pin.fails=0;save();var f2=gate.onok;closeGate();f2();}
      else{S.pin.fails++;if(S.pin.fails>=5){S.pin.lockUntil=Date.now()+60000;S.pin.fails=0;}save();gate.buf='';sfx('wrong');drawGate('Wrong PIN. Try again.');var pd=document.getElementById('pindots');if(pd)pd.classList.add('bad');}
    }
  },150);
}

  var o=document.getElementById('gateov');if(!o||!gate)return;gate.view='forgot';

  var o=document.createElement('div');o.id='sleepov';o.className='overlay';
  o.innerHTML='<div class="card sleepy">'+gajju('sleep')+'<h2>Gajju is sleepy</h2><p>That’s all the playing for today. See you tomorrow!</p>'+grownBtn()+'</div>';
  document.body.appendChild(o);syncMusic();sfx('snore');setT(function(){say('Gajju is sleepy. See you tomorrow!');},1200);

function hideSleepy(){var was=sleepyOn;sleepyOn=false;var o=document.getElementById('sleepov');if(o)o.remove();if(was)syncMusic();}

setInterval(function(){
  if(sleepyOn&&!limitReached()&&!gate){hideSleepy();}
  if(document.visibilityState!=='visible'||cur.screen==='parent'||gate||sleepyOn)return;
  var t=C.dateKey();S.played[t]=(S.played[t]||0)+1;tick++;
  var keys=Object.keys(S.played).sort();if(keys.length>14)delete S.played[keys[0]];

  if(limitReached()){save();showSleepy();}
},1000);

function holdDone(kind){
  lastHoldDone=Date.now();var oh=document.querySelector('.ghint');if(oh)oh.remove();
  if(kind==='practice'){sfx('unlock');if(S.pin){S.seenSetup=true;save();go('home');}else go('welcome',{step:2});return;}
  if(kind==='gate'){if(sleepyOn)openGate(null,function(){var d=C.dateKey();S.extra[d]=(S.extra[d]||0)+15;save();hideSleepy();go('parent');});else openGate(null);}
  else if(kind==='reset'){S.prog={};S.played={};S.extra={};save();say('All progress erased.');render();}
  else if(kind==='wipe'){var d=C.defaults();d.played=S.played;d.extra=S.extra;d.settings.limit=S.settings.limit;S=d;save();closeGate();go('welcome');if(limitReached())showSleepy();}
}
document.addEventListener('pointerdown',holdStart);
['pointerup','pointercancel','pointerleave'].forEach(function(ev){document.addEventListener(ev,function(e){if(ev==='pointerleave'&&e.target!==document)return;holdEnd();});});
document.addEventListener('pointerout',function(e){if(hold&&e.target===hold.el&&!hold.el.contains(e.relatedTarget))holdEnd();});
document.addEventListener('contextmenu',function(e){if(e.target.closest('[data-hold]'))e.preventDefault();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&gate)closeGate();if(gate&&/^[0-9]$/.test(e.key))pinKey(e.key);if(gate&&e.key==='Backspace')ACTS.pinDel();});

go(!S.pin&&!S.seenSetup?'welcome':'home');
if(limitReached())showSleepy();
})();
</script>
</body>
</html>
